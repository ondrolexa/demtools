[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demtools"]

[project]
name = "demtools"
version = "0.1.0"
description = "Python package to manipulate and analyze DEM grids"
readme = "README.md"
maintainers = [{ name = "Ondrej Lexa", email = "lexa.ondrej@gmail.com" }]
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "rasterio",
    "affine",
    "h5py",
    "geojson",
    "scikit-learn",
    "colorcet",
    "shapely",
    "tqdm",
    "requests>=2.34.2",
]

[project.optional-dependencies]
lab = ["jupyterlab"]
tests = ["pytest", "pytest-cov", "nbval"]
docs = [
    "ipykernel",
    "nbsphinx",
    "nbsphinx-link",
    "sphinx",
    "sphinx_mdinclude",
    "sphinx_rtd_theme",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
    "pytest-cov",
    "nbval",
    "jupyterlab",
    "ipykernel",
    "nbsphinx",
    "nbsphinx-link",
    "sphinx",
    "sphinx_mdinclude",
    "sphinx_rtd_theme",
]

[tool.black]
line-length = 88
extend-exclude = '''.*ui_.*'''
target-version = ["py312", "py313", "py314"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests", "notebooks"]
filterwarnings = [
    "ignore::rasterio.errors.NotGeoreferencedWarning",
]
